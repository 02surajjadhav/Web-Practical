<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration Form</title>

        <style>
            body{
                font-family:'Times New Roman', Times, serif;
                background: #0a0a0a;
            }
            .form-container{
                width:400px;
                margin:50px auto;
                background:rgb(4, 237, 245);
                padding:25px;
                border-radius:10px;
                box-shadow:0 0 10px rgb(255, 2, 2);
            }
            h2{
               text-align:center;
            }
            label{
                display: block;
                margin-top: 10px;
            }
            input{
                width:95%;
                padding:10px;
                margin: 5px;;
            }
            button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: green;
            color: rgb(0, 252, 21);
            border:chartreuse;
            cursor: pointer;
            }
            .error {
            color: rgb(252, 14, 14);
            font-size: 14px;
            }
        </style>
    </head>
        <body>
            <div class="form-container">
                <h2>Registration Form</h2>
                <form onsubmit="return validateForm()">

                <label>Name:</label>
                <input type="text" id="name">
                <span id="nameError" class="error"></span>

                <label>Email:</label>
                <input type="text" id="email">
                <span id="emailError" class="error"></span>

                <label>Mobile Number:</label>
                <input type="text" id="mobile">
                <span id="mobileError" class="error"></span>

                <label>Password:</label>
                <input type="password" id="password">
                <span id="passwordError" class="error"></span>

                <label>Age:</label>
                <input type="number" id="age">
                <span id="ageError" class="error"></span>

                <button type="submit">Register</button>
                </form>
            </div>
            <script>
                function validateForm(){
                    let name = document.getElementById("name").value.trim();
                    let email = document.getElementById("email").value.trim();
                    let mobile = document.getElementById("mobile").value.trim();
                    let password = document.getElementById("password").value;
                    let age = document.getElementById("age").value;

                    document.getElementById("nameError").innerHTML = "";
                    document.getElementById("emailError").innerHTML = "";
                    document.getElementById("mobileError").innerHTML = "";
                    document.getElementById("passwordError").innerHTML = "";
                    document.getElementById("ageError").innerHTML = "";

                    let isValid = true;

                    if (name === "") {
                        document.getElementById("nameError").innerHTML="Name is required";
                        isValid = false;
                    }
                    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                    if (email === "") {
                        document.getElementById("emailError").innerHTML ="Email is required";
                        isValid = false;
                    }
                    else if (!emailPattern.test(email)) {
                        document.getElementById("emailError").innerHTML ="Enter a valid email";
                        isValid = false;
                    }
                    let mobilePattern = /^[0-9]{10}$/;

                    if (mobile === "") {
                        document.getElementById("mobileError").innerHTML ="Mobile number is required";
                        isValid = false;
                    }
                    else if (!mobilePattern.test(mobile)) {
                        document.getElementById("mobileError").innerHTML="Mobile number must contain 10 digits";
                        isValid = false;
                    }

                    if (password === "") {
                        document.getElementById("passwordError").innerHTML ="Password is required";
                       isValid = false;
                    }
                    else if (password.length < 6) {
                        document.getElementById("passwordError").innerHTML ="Password must be at least 6 characters";
                        isValid = false;
                    }
                    if (age === "") {
                        document.getElementById("ageError").innerHTML ="Age is required";
                        isValid = false;
                    }
                    else if (age < 18) {
                        document.getElementById("ageError").innerHTML ="Age must be 18 or above";
                        isValid = false;
                    }
                    if (isValid) {
                        alert("Registration Successful!");
                    }

                    return isValid;
                    }
            </script>
        </body>
</html>
